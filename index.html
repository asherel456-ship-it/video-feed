<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Video Feed</title>
<link rel="manifest" href="app.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #stage{
    position:fixed; inset:0; background:#000; overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    transform:translateY(0);
    transition:transform 0.32s cubic-bezier(.22,.9,.32,1);
    will-change:transform;
  }
  .slide video{
    max-width:100%; max-height:100%;
    width:auto; height:auto;
    object-fit:contain;
    background:#000;
  }
  #loading{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.6); font-size:14px; letter-spacing:0.02em;
    background:#000;
    transition:opacity 0.3s ease;
    visibility:hidden;
  }
  #lockWrap.hide ~ #loading{ visibility:visible; }
  #loading.hide{ opacity:0; pointer-events:none; }
  #muteHint{
    position:fixed; bottom:env(safe-area-inset-bottom, 18px); left:0; right:0;
    text-align:center; color:rgba(255,255,255,0.55); font-size:12px;
    letter-spacing:0.03em; pointer-events:none; z-index:5;
    transition:opacity 0.4s ease;
  }
  #muteHint.hide{ opacity:0; }

  /* ===== Password lock screen ===== */
  #lockWrap{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:22px;
    background:#000;
  }
  #lockWrap.hide{ display:none; }
  #lockIcon{ font-size:32px; opacity:0.8; }
  #lockTitle{ font-size:14px; color:rgba(255,255,255,0.5); letter-spacing:0.03em; }
  #lockForm{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    width:78%; max-width:280px;
  }
  #pwInput{
    width:100%;
    padding:13px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06);
    color:#f4f2ee;
    font-size:16px;
    text-align:center;
    outline:none;
    letter-spacing:0.08em;
    transition:border-color 0.2s ease, transform 0.1s ease;
  }
  #pwInput:focus{ border-color:#89CFF0; }
  #pwSubmit{
    width:100%;
    padding:13px 16px;
    border-radius:14px;
    border:none;
    background:#89CFF0;
    color:#0a2a38;
    font-size:15px; font-weight:700; letter-spacing:0.03em;
    cursor:pointer;
  }
  #lockForm.wrong #pwInput{
    border-color:#ff5a5a;
    animation:shake 0.35s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(5px); }
  }
</style>
</head>
<body>

<div id="lockWrap">
  <div id="lockIcon">&#128274;</div>
  <div id="lockTitle">Enter password</div>
  <form id="lockForm" autocomplete="off">
    <input id="pwInput" type="password" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="pwSubmit" type="submit">Unlock</button>
  </form>
</div>

<div id="stage">
  <div class="slide" id="slideA"><video playsinline webkit-playsinline muted loop></video></div>
  <div class="slide" id="slideB"><video playsinline webkit-playsinline muted loop></video></div>
</div>

<div id="muteHint">tap for sound &middot; swipe up / down</div>
<div id="loading">Loading videos&hellip;</div>

<script>
(function(){
  const APP_PASSWORD = 'Bubbles';

  const lockWrap = document.getElementById('lockWrap');
  const lockForm = document.getElementById('lockForm');
  const pwInput = document.getElementById('pwInput');

  lockForm.addEventListener('submit', function(e){
    e.preventDefault();
    if(pwInput.value === APP_PASSWORD){
      lockWrap.classList.add('hide');
      boot();
    } else {
      lockForm.classList.remove('wrong');
      void lockForm.offsetWidth; // restart animation
      lockForm.classList.add('wrong');
      pwInput.value = '';
    }
  });

  const stage = document.getElementById('stage');
  const loadingEl = document.getElementById('loading');
  const muteHintEl = document.getElementById('muteHint');
  const slideA = document.getElementById('slideA');
  const slideB = document.getElementById('slideB');
  const vidA = slideA.querySelector('video');
  const vidB = slideB.querySelector('video');

  let queue = [];      // shuffled order of filenames, grows as needed
  let index = 0;       // current position within queue
  let soundOn = false;

  let current = { slide: slideA, video: vidA };
  let next    = { slide: slideB, video: vidB };

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Extend the queue with a fresh shuffled pass of all videos,
  // avoiding an immediate repeat of the last video shown.
  function extendQueue(allFiles){
    let batch = shuffle(allFiles);
    if(queue.length){
      const last = queue[queue.length - 1];
      if(batch[0] === last && batch.length > 1){
        [batch[0], batch[1]] = [batch[1], batch[0]];
      }
    }
    queue = queue.concat(batch);
  }

  let allFiles = [];

  function urlFor(file){
    return 'videos/' + encodeURIComponent(file);
  }

  function loadInto(target, file){
    target.video.src = urlFor(file);
    target.video.muted = !soundOn;
    target.video.currentTime = 0;
    target.video.load();
    const p = target.video.play();
    if(p && p.catch) p.catch(()=>{});
  }

  function ensureAhead(){
    // keep at least 2 videos ahead of current index queued
    while(queue.length < index + 3){
      extendQueue(allFiles);
    }
  }

  function showIndex(newIndex, direction){
    // direction: 1 = swipe up (going to next/new), -1 = swipe down (going back)
    if(newIndex < 0) return;
    ensureAhead();
    if(newIndex >= queue.length) return;

    index = newIndex;
    const file = queue[index];

    // slide transition: move current out, bring next in from appropriate side
    const outY = direction >= 0 ? '-100%' : '100%';
    const inFromY = direction >= 0 ? '100%' : '-100%';

    next.slide.style.transition = 'none';
    next.slide.style.transform = 'translateY(' + inFromY + ')';
    loadInto(next, file);

    // force reflow so the transition applies
    void next.slide.offsetHeight;

    next.slide.style.transition = '';
    current.slide.style.transform = 'translateY(' + outY + ')';
    next.slide.style.transform = 'translateY(0)';

    current.video.pause();

    const tmp = current;
    current = next;
    next = tmp;

    updateTitle();
  }

  function updateTitle(){
    document.title = 'Video ' + (index + 1);
  }

  // ---- swipe handling ----
  let touchStartY = null;
  let touchStartX = null;
  const SWIPE_THRESHOLD = 60;

  stage.addEventListener('touchstart', function(e){
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }, { passive:true });

  stage.addEventListener('touchend', function(e){
    if(touchStartY === null) return;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartY = null;

    if(Math.abs(dy) < SWIPE_THRESHOLD || Math.abs(dx) > Math.abs(dy)) return;

    if(dy < 0){
      // swiped up -> next video
      showIndex(index + 1, 1);
    } else {
      // swiped down -> previous video
      if(index > 0) showIndex(index - 1, -1);
    }
  }, { passive:true });

  // Also support mouse/trackpad wheel for desktop testing
  let wheelLock = false;
  stage.addEventListener('wheel', function(e){
    if(wheelLock) return;
    if(Math.abs(e.deltaY) < 30) return;
    wheelLock = true;
    setTimeout(()=> wheelLock = false, 400);
    if(e.deltaY > 0) showIndex(index + 1, 1);
    else if(index > 0) showIndex(index - 1, -1);
  }, { passive:true });

  // Unmute on first tap (browsers block audio autoplay until a gesture)
  function enableSound(){
    soundOn = true;
    current.video.muted = false;
    muteHintEl.classList.add('hide');
    document.removeEventListener('touchend', enableSound, true);
  }
  document.addEventListener('touchend', enableSound, true);

  // ---- boot (runs only after correct password) ----
  function boot(){
    fetch('manifest.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        allFiles = (data.videos || []).slice();
        if(allFiles.length === 0){
          loadingEl.textContent = 'No videos found — add some to /videos and list them in manifest.json';
          return;
        }
        extendQueue(allFiles);
        loadInto(current, queue[0]);
        loadingEl.classList.add('hide');
        setTimeout(()=> muteHintEl.classList.add('hide'), 3500);
      })
      .catch(err => {
        loadingEl.textContent = 'Could not load manifest.json';
        console.error(err);
      });
  }

})();
</script>
</body>
</html>
