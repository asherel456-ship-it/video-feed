name: Auto-update manifest.json

on:
  push:
    paths:
      - 'videos/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate manifest.json from /videos folder
        run: |
          python3 - <<'EOF'
          import json
          import os

          video_dir = "videos"
          exts = (".mp4", ".mov", ".webm", ".m4v")

          files = sorted(
              f for f in os.listdir(video_dir)
              if f.lower().endswith(exts) and not f.startswith(".")
          ) if os.path.isdir(video_dir) else []

          with open("manifest.json", "w") as f:
              json.dump({"videos": files}, f, indent=2)
              f.write("\n")

          print(f"Wrote manifest.json with {len(files)} videos")
          EOF

      - name: Commit changes if manifest.json changed
        run: |
          if git diff --quiet -- manifest.json; then
            echo "No changes to manifest.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Auto-update manifest.json"
            git push
          fi
